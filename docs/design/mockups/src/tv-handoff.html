<!doctype html><html><head><meta charset="utf-8"><title>TV search-tip handoff</title>
<link rel="stylesheet" href="common.css"><script src="poster.js"></script></head><body class="tv">
<div class="backdrop" style="opacity:.55" data-art="Kestrel Bay" data-w="1920" data-h="1080"></div>
<div class="scrim" style="background:linear-gradient(90deg,var(--bg) 0%,rgba(14,16,32,.92) 55%,rgba(14,16,32,.7) 100%)"></div>
<div class="safe">
 <div style="position:absolute;left:40px;top:170px;width:360px;height:540px;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)" data-art="Kestrel Bay" data-w="360" data-h="540"></div>
 <section style="position:absolute;left:480px;top:200px;width:1200px">
  <div class="overline rec">Opening your streaming app…</div>
  <div style="font-size:40px;font-weight:600;margin-top:26px;color:var(--text2)">When it opens, search for:</div>
  <div style="margin-top:22px;display:inline-flex;align-items:center;gap:30px;background:var(--s2);border:4px solid var(--text3);border-radius:24px;padding:22px 44px 26px 36px">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#BFC2D6" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <span class="serif" style="font-size:84px;line-height:92px;font-weight:600">Kestrel Bay</span></div>
  <div style="display:flex;align-items:center;gap:18px;margin-top:48px">
    <span class="avatar av-sky" style="width:56px;height:56px;font-size:22px">P</span>
    <span style="font-size:32px;line-height:44px;font-weight:500"><span style="color:var(--text2)">Priya’s tip:</span> “Start at episode 2, trust me.”</span></div>
 </section>
 <div style="position:absolute;left:480px;right:40px;bottom:150px">
  <div style="height:10px;border-radius:5px;background:var(--s2);overflow:hidden"><div style="width:62%;height:100%;background:var(--accent);border-radius:5px"></div></div>
  <div style="display:flex;gap:56px;margin-top:26px"><span class="hint"><span class="kbd">OK</span>Open now</span><span class="hint"><span class="kbd">◀ BACK</span>Stay here</span></div>
 </div>
</div></body></html>
